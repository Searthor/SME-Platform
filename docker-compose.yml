services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sme_platform
      POSTGRES_USER: sme
      POSTGRES_PASSWORD: sme_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sme -d sme_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - sme_postgres_data:/var/lib/postgresql/data

volumes:
  sme_postgres_data:
